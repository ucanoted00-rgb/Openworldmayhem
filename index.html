<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open World Mayhem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,900&family=Pixelify+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="uw"></div>
<div id="heat"></div>
<div id="pois"></div>
<div id="coil-flash" aria-hidden="true"></div>
<div id="qte-damage" aria-hidden="true"></div>
<div id="dash-flash" aria-hidden="true"></div>
<!-- Quick Time Event da cobra: toque quando a linha vertical cruzar a zona verde; são necessários 5–7 acertos. -->
<div id="qte" class="hidden">
  <div id="qte-top">
   <svg id="qte-ico" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true"><path d="M13 12.5c-4.4 2.2-3.1 7.3 1.8 7.8 4.1.4 6.7-3.7 9.8-3.2 4.5.7 5.7 5.7 1.4 7.5-2.8 1.2-6.1-.8-7.8 1.3-2.3 2.8 1.5 5.8 5.3 4.1 1.5-.7 2.4-1.8 2.8-3" fill="none" stroke="#c9ffd3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22.9 9.5l5.8 1.2-2.9 4.8-2.9-2.4z" fill="#7dff9e" stroke="#e6ffee" stroke-width=".8" stroke-linejoin="round"/></svg>
   <div id="qte-t">SOLTE-SE!</div><div id="qte-n">0/6</div>
  </div>
  <div id="qte-pips"></div>
  <canvas id="qte-c" width="320" height="92"></canvas>
  <div id="qte-s"></div>
 </div>
<div id="ui"></div>

<div id="hud" class="hidden">
  <div id="look"></div>
  <div id="fps" class="hidden">0 FPS</div>
  <div id="hint">
    <span><kbd>Esc</kbd> Menu</span>
    <span><kbd>Shift</kbd> Sprint</span>
    <span><kbd>Q</kbd> Dash</span>
    <span><kbd>E</kbd> Inventário</span>
    <span><kbd>F</kbd> Coletar</span>
    <span><kbd>F1-F4</kbd> Animações</span>
  </div>
  
  <div id="survival-bars" role="group" aria-label="Fome e sede">
    <div class="survival-bar" id="hunger-bar" role="progressbar" aria-label="Fome" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"><div id="hunger-fill"></div></div>
    <div class="survival-bar" id="thirst-bar" role="progressbar" aria-label="Sede" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"><div id="thirst-fill"></div></div>
  </div>
  <button class="tb" id="bPause" aria-label="Abrir menu de pausa">≡</button>

  <!-- Barra de vida no canto superior esquerdo -->
  <div id="health-wrap">
    <div id="health-bar"><div id="health-fill"></div><span id="health-text">100 / 100</span></div>
    <div id="stamina-bar"><div id="stamina-fill"></div><span id="stamina-text">50 / 50</span></div>
    <!-- Ícone de calor (sol em pixel art; aparece no deserto): anel = tempo restante -->
    <div id="heat-ic">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="18.5" fill="#1a0e07" fill-opacity=".78" stroke="#05060a" stroke-width="2"/>
        <circle id="heat-ring" cx="20" cy="20" r="16" fill="none" stroke="#ffb02e" stroke-width="3" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
        <g shape-rendering="crispEdges">
        <path fill="#2a0f06" d="M18 6h4v2h-4zM12 8h2v2h-2zM16 8h2v2h-2zM22 8h2v2h-2zM26 8h2v2h-2zM10 10h2v2h-2zM14 10h4v2h-4zM22 10h4v2h-4zM28 10h2v2h-2zM12 12h2v2h-2zM26 12h2v2h-2zM12 14h2v2h-2zM26 14h2v2h-2zM8 16h4v2h-4zM28 16h4v2h-4zM6 18h2v2h-2zM32 18h2v2h-2zM6 20h2v2h-2zM32 20h2v2h-2zM8 22h4v2h-4zM28 22h4v2h-4zM12 24h2v2h-2zM26 24h2v2h-2zM12 26h2v2h-2zM26 26h2v2h-2zM10 28h2v2h-2zM14 28h4v2h-4zM22 28h4v2h-4zM28 28h2v2h-2zM12 30h2v2h-2zM16 30h2v2h-2zM22 30h2v2h-2zM26 30h2v2h-2zM18 32h4v2h-4z"/>
        <path fill="#ffe27a" d="M18 8h2v2h-2zM12 10h2v2h-2zM16 14h2v2h-2zM14 16h4v2h-4zM8 18h2v2h-2z"/>
        <path fill="#ffc83a" d="M20 8h2v2h-2zM18 10h2v2h-2zM26 10h2v2h-2zM14 12h8v2h-8zM18 14h4v2h-4zM12 16h2v2h-2zM18 16h2v2h-2zM10 18h10v2h-10zM8 20h2v2h-2zM12 20h4v2h-4zM12 28h2v2h-2z"/>
        <path fill="#ff8f1f" d="M20 10h2v2h-2zM22 12h4v2h-4zM22 14h4v2h-4zM20 16h4v2h-4zM20 18h4v2h-4zM28 18h2v2h-2zM10 20h2v2h-2zM16 20h6v2h-6zM12 22h8v2h-8zM14 24h2v2h-2zM14 26h2v2h-2zM18 28h2v2h-2zM26 28h2v2h-2z"/>
        <path fill="#fff6d8" d="M14 14h2v2h-2z"/>
        <path fill="#e0561a" d="M24 16h2v2h-2zM24 18h2v2h-2zM30 18h2v2h-2zM22 20h2v2h-2zM28 20h2v2h-2zM20 22h2v2h-2zM16 24h4v2h-4zM24 26h2v2h-2zM20 28h2v2h-2zM18 30h2v2h-2z"/>
        <path fill="#a82a12" d="M26 16h2v2h-2zM26 18h2v2h-2zM24 20h4v2h-4zM30 20h2v2h-2zM22 22h6v2h-6zM20 24h6v2h-6zM16 26h8v2h-8zM20 30h2v2h-2z"/>
      </g>
      </svg>
      <span id="heat-t">3:20</span>
    </div>
    <!-- Ícone de veneno (gota em pixel art): anel = tempo do efeito / cooldown -->
    <div id="pois-ic">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="18.5" fill="#0c1a08" fill-opacity=".78" stroke="#05060a" stroke-width="2"/>
        <circle id="pois-ring" cx="20" cy="20" r="16" fill="none" stroke="#7dff3a" stroke-width="3" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
        <g shape-rendering="crispEdges">
        <path fill="#06160a" d="M18 8h4v2h-4zM16 10h2v2h-2zM22 10h2v2h-2zM16 12h2v2h-2zM22 12h2v2h-2zM12 14h4v2h-4zM24 14h4v2h-4zM10 16h2v2h-2zM28 16h2v2h-2zM10 18h2v2h-2zM28 18h2v2h-2zM8 20h2v2h-2zM30 20h2v2h-2zM8 22h2v2h-2zM30 22h2v2h-2zM8 24h2v2h-2zM30 24h2v2h-2zM10 26h2v2h-2zM28 26h2v2h-2zM10 28h2v2h-2zM28 28h2v2h-2zM12 30h2v2h-2zM26 30h2v2h-2zM14 32h12v2h-12z"/>
        <path fill="#c9ff7a" d="M18 10h4v2h-4zM18 12h4v2h-4zM16 14h4v2h-4zM12 16h6v2h-6zM12 18h4v2h-4zM10 20h4v2h-4zM10 22h4v2h-4zM10 24h2v2h-2z"/>
        <path fill="#8cf03a" d="M20 14h4v2h-4zM18 16h6v2h-6zM18 18h4v2h-4zM16 20h6v2h-6zM16 22h4v2h-4zM12 24h6v2h-6zM12 26h4v2h-4zM12 28h4v2h-4z"/>
        <path fill="#52c21a" d="M24 16h4v2h-4zM22 18h6v2h-6zM22 20h4v2h-4zM20 22h6v2h-6zM18 24h6v2h-6zM16 26h6v2h-6zM16 28h4v2h-4zM14 30h6v2h-6z"/>
        <path fill="#f4ffe0" d="M16 18h2v2h-2zM14 20h2v2h-2zM14 22h2v2h-2z"/>
        <path fill="#2c8a14" d="M26 20h4v2h-4zM26 22h4v2h-4zM26 24h4v2h-4zM24 26h4v2h-4zM20 28h8v2h-8zM20 30h6v2h-6z"/>
        <path fill="#d8ffb0" d="M24 24h2v2h-2zM22 26h2v2h-2z"/>
      </g>
      </svg>
      <span id="pois-t"></span>
    </div>
    <!-- Cobra enrolada: anel = tempo restante da tentativa do QTE -->
    <div id="coil-ic" title="Enrolado — tempo da tentativa" aria-label="Jogador enrolado pela cobra">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="18.5" fill="#1d0d12" fill-opacity=".84" stroke="#05060a" stroke-width="2"/>
        <circle id="coil-ring" cx="20" cy="20" r="16" fill="none" stroke="#ff5a62" stroke-width="3" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
        <path d="M13 12.5c-4.4 2.2-3.1 7.3 1.8 7.8 4.1.4 6.7-3.7 9.8-3.2 4.5.7 5.7 5.7 1.4 7.5-2.8 1.2-6.1-.8-7.8 1.3-2.3 2.8 1.5 5.8 5.3 4.1 1.5-.7 2.4-1.8 2.8-3" fill="none" stroke="#ffd5d6" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22.9 9.5l5.8 1.2-2.9 4.8-2.9-2.4z" fill="#ff777d" stroke="#ffe2e3" stroke-width=".8" stroke-linejoin="round"/>
        <circle cx="26.5" cy="11.6" r=".75" fill="#26070a"/>
      </svg>
      <span id="coil-label">Enrolado</span>
      <span id="coil-t">2.4s</span>
    </div>
  </div>

  <!-- Controles de toque -->
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="bJump">Pular</button>
  <button class="tb" id="bPunch" aria-label="LMB — socar">LMB</button>
  <button class="tb dash-btn" id="bDash" aria-label="Dash (Q)" title="Dash — cooldown de 6 segundos">
    <img src="dash-icon.png" alt="">
    <span class="dash-label">DASH</span>
    <span id="dash-cd" class="dash-cd" aria-live="polite"></span>
  </button>
  <button class="tb" id="bInv">Inv</button>
  <button id="collect" class="hidden">Coletar</button>
  <button class="tb" id="bSprint">Sprint</button>
</div>

<div id="toast" class="hidden"></div>

<!-- Three.js base -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>   <!-- modelo da mesa de fabricação -->

<!-- ================= PÓS-PROCESSAMENTO (BLOOM) — classes ficam em THREE.* ================= -->
<!-- 1. Classes base de Pós-processamento -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

<!-- 2. Shaders auxiliares (DEVEM vir antes do UnrealBloomPass) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<!-- 3. Efeito Bloom (Obrigatoriamente depois dos shaders) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<!-- ============================================================== -->

<!-- Controles de transformação (Gizmo do editor de animação) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<!-- Código do Jogo (Ordem lógica de execução) -->
<script src="core.js"></script>
<script src="survival.js"></script>   <!-- lógica testável de fome e sede -->
<script src="river-logic.js"></script> <!-- decisões determinísticas e testadas para rios por bioma -->
<script src="music.js"></script>   <!-- trilha por tela: início, pausa e configurações (arquivos .mp3 na raiz) -->
<script src="forest.js"></script>   <!-- pack Low Poly Forest: só as pedras -->
<script src="logs.js"></script>     <!-- toras de madeira: Wooden Logs por Oneironauticus (CC-BY-4.0), otimizadas -->
<script src="desert.js"></script>   <!-- plantas do deserto: Desert Shrubs por evolveduk (Sketchfab Standard), otimizado -->
<script src="scorpion.js"></script>   <!-- escorpião: Scorpion por kenchoo (CC-BY-4.0), animações run/attack feitas por cima do rig -->
<script src="snake.js"></script>      <!-- cobra: Snake por ChristineDesigns (CC-BY-4.0), usa o clipe original do modelo (convert_snake.py) -->
<script src="knife.js"></script>    <!-- faca de combate: Low-poly Combat Knife por maurisnosram123 (CC-BY-4.0), otimizada (convert_knife.py) -->
<script src="stoneknife.js"></script>   <!-- modelo da faca de pedra (glTF embutido) -->
<script src="weapon.js"></script>   <!-- armas: atributos e malha da faca -->
<script src="trees.js"></script>    <!-- árvores -->
<script src="cherry.js"></script>   <!-- cerejeiras: Cherry Blossom Trees por Jagobo (CC-BY-4.0), otimizadas (tools/convert_cherry.py) -->    <!-- árvores: Trees Low Poly por Igor_K. (CC-BY-4.0) -->
<script src="postprocess.js"></script>
<script src="leaves.js"></script>      <!-- folhas/pétalas caindo ao quebrar árvore (1 Points com shader próprio) -->
<script src="sandstorm.js"></script>   <!-- tempestade de areia do deserto: névoa + tela + grãos na GPU + vento -->
<script src="desertwind.js"></script>   <!-- brisa do deserto: vento constante com poeira sutil (GPU) -->
<script src="cherryfog.js"></script>   <!-- névoa climática da floresta e do cerejeiral: evento probabilístico com maior chance à noite -->
<script src="grass.js"></script>     <!-- textura de grama do chão (base64) -->
<script src="subdiv.js"></script>    <!-- subdivisão da malha do personagem (mais polígonos) -->
<script src="lowpoly.js"></script>   <!-- personagem low poly embutido ("Simple Low Poly Character" por PIXELOKAY, CC-BY 4.0) -->
<script src="hair.js"></script>   <!-- estilos de cabelo procedurais -->
<script src="skin.js"></script>
<script src="ualanim.js"></script>   <!-- clipes de animação (Quaternius, CC0) -->
<script src="playeranim.js"></script>
<script src="animeditor.js"></script>
<script src="creator.js"></script>   <!-- criador de personagem (preview 3D + categorias) -->
<script src="fish.js"></script>   <!-- peixes de rio (glTF embutido) -->
<script src="game.js"></script>
</body>
</html>
